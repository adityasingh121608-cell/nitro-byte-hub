<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="1dkz16US3TNMMFymvbJvUdLLs9UOD92laIK2a69lPeQ" />

    <!-- Primary SEO Meta Tags -->
    <title>Nitro-Byte Hub | Indie Game Publishing & Developer Social Network</title>
    <meta name="title" content="Nitro-Byte Hub | Indie Game Publishing & Developer Social Network">
    <meta name="description" content="Nitro-Byte Hub is a free-to-use social network, game publishing, and B2B deal-making platform built for indie game developers and studios.">
    <meta name="keywords" content="indie games, game publishing, web games, Phaser 3, game dev community, B2B deal room, playable ads">
    <meta name="author" content="Nitro-Byte Studio">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nitro-byte-hub.vercel.app/">
    <meta property="og:title" content="Nitro-Byte Hub | Indie Game Publishing">
    <meta property="og:description" content="Discover, publish, and play indie web games. Connect with game studios and developers worldwide.">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        input, textarea, select, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: #0284c7;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0369a1;
        }
        .btn-secondary {
            background: #475569;
            margin-top: 5px;
        }
        .btn-secondary:hover {
            background: #64748b;
        }
        .post-card {
            background: #334155;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .post-card h4 {
            margin: 0 0 5px 0;
            color: #38bdf8;
        }
        .post-card p {
            margin: 0 0 10px 0;
            color: #cbd5e1;
            white-space: pre-wrap;
        }
        .badge {
            background: #0284c7;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
        }
        .game-embed-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .game-embed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #authSection, #postFormContainer {
            display: none;
        }
    </style>

    <!-- Load Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>⚡ NITRO-BYTE HUB</h1>
        <p>The free social network, game publishing & B2B deal platform for developers.</p>
    </header>

    <div class="container">
        <!-- Auth Box (Login / Sign Up) -->
        <div class="box" id="authBox">
            <h3 id="authTitle">Account Login</h3>
            <div id="authSection">
                <input type="email" id="authEmail" placeholder="Enter your email" required>
                <input type="password" id="authPassword" placeholder="Enter your password" required>
                <button id="loginBtn">Log In</button>
                <button id="signupBtn" class="btn-secondary">Sign Up New Account</button>
            </div>
            <div id="userSection" style="display: none;">
                <p>Logged in as: <strong id="userEmailDisplay" style="color: #38bdf8;"></strong></p>
                <button id="logoutBtn" class="btn-secondary">Log Out</button>
            </div>
        </div>

        <!-- Post Creation Form -->
        <div class="box" id="postFormContainer">
            <h3>Create a Post / Share a Game</h3>
            <form id="postForm">
                <select id="contentType">
                    <option value="text">Text / Idea</option>
                    <option value="game">Game / Playable (Embed URL)</option>
                    <option value="video">Video / Trailer</option>
                    <option value="article">Blog / Article</option>
                </select>
                <input type="text" id="postTitle" placeholder="Post Title or Game Name" required>
                <textarea id
