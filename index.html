<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="1dkz16US3TNMMFymvbJvUdLLs9UOD92laIK2a69lPeQ" />

    <!-- Primary SEO Meta Tags -->
    <title>Nitro-Byte Hub | Global Indie Game Ecosystem & B2B Deal Network</title>
    <meta name="title" content="Nitro-Byte Hub | Global Indie Game Ecosystem & B2B Deal Network">
    <meta name="description" content="Nitro-Byte Hub is a premier indie game publishing, social networking, and B2B deal-making platform. Play web games, pitch studios, and connect globally.">

    <style>
        /* --- PROFESSIONAL HIGH-BUDGET THEME SYSTEM --- */
        :root[data-theme="dark"] {
            --bg-main: #070b14;
            --bg-card: #0e1626;
            --bg-elevated: #162238;
            --border-color: #223354;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --accent-glow: rgba(0, 242, 254, 0.25);
            --header-gradient: linear-gradient(135deg, #0e1626 0%, #15233c 100%);
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.5);
            --danger: #ef4444;
            --success: #22c55e;
            --badge-bg: rgba(0, 242, 254, 0.1);
        }

        :root[data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-primary: #0284c7;
            --accent-secondary: #0369a1;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --header-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.08);
            --danger: #dc2626;
            --success: #16a34a;
            --badge-bg: rgba(2, 132, 199, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-gradient);
            border: 1px solid var(--border-color);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-subtle);
        }

        .brand-logo h1 {
            color: var(--accent-primary);
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-primary);
        }

        .platform-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 1024px) {
            .platform-container {
                grid-template-columns: 320px 1fr 300px;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 20px;
        }

        .card h3 {
            color: var(--accent-primary);
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        input, textarea, select, button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button.primary-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #070b14;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        button.primary-btn:hover {
            opacity: 0.92;
        }

        button.secondary-btn {
            background: var(--bg-elevated);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-weight: 600;
            cursor: pointer;
        }

        button.secondary-btn:hover {
            border-color: var(--accent-primary);
        }

        .ecosystem-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        .tab-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-pill.active {
            background: var(--accent-primary);
            color: #070b14;
            border-color: var(--accent-primary);
        }

        .post-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .creator-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--accent-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            border: 1px solid var(--accent-primary);
        }

        .post-card h4 {
            color: var(--text-main);
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .post-card p {
            color: var(--text-muted);
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .embed-container {
            position: relative;
            width: 100%;
            height: clamp(300px, 45vw, 450px);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .embed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .interaction-bar {
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .interaction-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            width: auto;
            margin: 0;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .interaction-btn:hover {
            background: var(--bg-card);
            color: var(--accent-primary);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 50px;
            border-top: 1px solid var(--border-color);
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="brand-logo">
            <h1>⚡ Nitro-Byte Hub</h1>
        </div>
        <div class="header-controls">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light Mode</button>
        </div>
    </header>

    <div class="platform-container">
        
        <!-- Left Sidebar: Auth & Studio Profile -->
        <div class="left-sidebar">
            <div class="card" id="authCard">
                <h3 id="authTitle">🔒 Creator Account</h3>
                <div id="authSection">
                    <input type="email" id="authEmail" placeholder="developer@studio.com" required>
                    <input type="password" id="authPassword" placeholder="Password" required>
                    <button class="primary-btn" id="loginBtn">Log In</button>
                    <button class="secondary-btn" id="signupBtn">Register Profile</button>
                </div>
                <div id="userSection" style="display: none;">
                    <p style="font-size: 0.9rem; margin-bottom: 12px;">Signed In As:<br><strong id="userEmailDisplay" style="color: var(--accent-primary); word-break: break-all;"></strong></p>
                    <button class="secondary-btn" id="logoutBtn">Sign Out</button>
                </div>
            </div>
        </div>

        <!-- Center Feed: Social, Games, Deals, Videos with Like, Comment, Follow -->
        <div class="center-feed">
            <div class="card">
                <div class="ecosystem-tabs">
                    <button class="tab-pill active" onclick="switchTab('all')">🌐 All Activity</button>
                    <button class="tab-pill" onclick="switchTab('game')">🎮 Web Games</button>
                    <button class="tab-pill" onclick="switchTab('deal')">💼 B2B Deals</button>
                    <button class="tab-pill" onclick="switchTab('video')">📺 Trailers</button>
                </div>

                <div id="postFormContainer" class="card" style="display: none; background: var(--bg-main); margin-bottom: 25px;">
                    <h3>✍️ Publish to Network</h3>
                    <form id="postForm">
                        <select id="contentType">
                            <option value="game">🕹️ Indie Web Game (Playable Embed URL)</option>
                            <option value="deal">💼 B2B Studio Contract / Playable Ad Pitch</option>
                            <option value="video">📺 Trailer / Devlog Video (YouTube Embed URL)</option>
                            <option value="social">💬 Social Feed Update</option>
                        </select>
                        <input type="text" id="postTitle" placeholder="Title / Project Name" required>
                        <textarea id="postBody" placeholder="Share your update, game details, or pitch..." rows="3" required></textarea>
                        <input type="url" id="mediaUrl" placeholder="Embed URL (Itch.io iframe or YouTube link) [Optional]">
                        <button type="submit" class="primary-btn">Publish Publicly</button>
                    </form>
                </div>

                <div id="postsFeed">
                    <p style="color: var(--text-muted); text-align: center; padding: 30px;">Loading network activity...</p>
                </div>
            </div>
        </div>

        <!-- Right Sidebar: Active Platform Directory -->
        <div class="right-sidebar">
            <div class="card">
                <h3>👥 Active Creators</h3>
                <div id="creatorsList" style="font-size: 0.9rem; color: var(--text-muted);">
                    Loading registered creators...
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Nitro-Byte Hub. Cross-device compatible across Windows, macOS, Linux, Android, and iOS.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://pzronhvahinbxzvgpyuc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MDPEgRnaOGc5nFbu5D6E1g_Nvi4m4aX';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let activeFilter = 'all';

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggleBtn').innerText = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        async function checkUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            currentUser = session ? session.user : null;
            updateAuthUI();
            loadPosts();
            loadCreators();
        }

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                document.getElementById('postFormContainer').style.display = 'block';
                document.getElementById('userEmailDisplay').innerText = currentUser.email;
                document.getElementById('authTitle').innerText = '💼 Studio Dashboard';
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('postFormContainer').style.display = 'none';
                document.getElementById('authTitle').innerText = '🔒 Creator Account';
            }
        }

        document.getElementById('signupBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if (!email || !password) { alert('Please enter email and password.'); return; }

            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) {
                alert('Registration error: ' + error.message);
            } else {
                alert('Account created successfully! You can now log in.');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if (!email || !password) { alert('Please enter email and password.'); return; }

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login error: ' + error.message);
            } else {
                currentUser = data.user;
                updateAuthUI();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await _supabase.auth.signOut();
            currentUser = null;
            updateAuthUI();
        });

        function switchTab(filter) {
            activeFilter = filter;
            document.querySelectorAll('.tab-pill').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadPosts();
        }

        async function loadCreators() {
            const creatorsDiv = document.getElementById('creatorsList');
            const { data, error } = await _supabase.from('posts').select('body');
            
            if (error || !data) {
                creatorsDiv.innerHTML = 'No active publishers found.';
                return;
            }

            // Extract unique creators from actual posts data to prevent showing unverified/fake data
            const uniquePublishers = [...new Set(data.map(p => {
                if (p.body && p.body.includes('(Publisher:')) {
                    return p.body.split('(Publisher:')[1].split(')')[0].trim();
                }
                return null;
            }).filter(Boolean))];

            if (uniquePublishers.length === 0) {
                creatorsDiv.innerHTML = 'Be the first registered creator!';
                return;
            }

            creatorsDiv.innerHTML = '';
            uniquePublishers.forEach(email => {
                creatorsDiv.innerHTML += `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);">
                        <span style="word-break: break-all; font-weight: 600; color: var(--text-main);">${escapeHtml(email)}</span>
                        <button class="secondary-btn" style="width: auto; padding: 4px 10px; font-size: 0.8rem;" onclick="alert('Subscribed & Following ${escapeHtml(email)}')">🔔 Follow</button>
                    </div>
                `;
            });
        }

        async function loadPosts() {
            const feedDiv = document.getElementById('postsFeed');
            const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });

            if (error) {
                feedDiv.innerHTML = `<p style="color: var(--danger);">Error loading feed: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                feedDiv.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px;">No publications found. Be the first studio to publish!</p>';
                return;
            }

            const filteredData = data.filter(post => {
                if (activeFilter === 'all') return true;
                return post.content_type === activeFilter;
            });

            if (filteredData.length === 0) {
                feedDiv.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px;">No items in this category yet.</p>';
                return;
            }

            feedDiv.innerHTML = '';
            filteredData.forEach(post => {
                let badgeLabel = '💬 Social';
                if (post.content_type === 'game') badgeLabel = '🕹️ Web Game';
                if (post.content_type === 'deal') badgeLabel = '💼 B2B Deal';
                if (post.content_type === 'video') badgeLabel = '📺 Video Stream';

                let publisher = 'Verified Studio';
                let displayBody = post.body || '';

                if (displayBody.includes('(Publisher:')) {
                    const parts = displayBody.split('(Publisher:');
                    displayBody = parts[0];
                    publisher = parts[1].split(')')[0].trim();
                }

                let embedHtml = '';
                if (displayBody.includes('[Embed URL:')) {
                    const parts = displayBody.split('[Embed URL:');
                    displayBody = parts[0];
                    let urlPart = parts[1].split(']')[0].trim();
                    
                    if (urlPart.includes('youtube.com/watch?v=')) {
                        urlPart = urlPart.replace('watch?v=', 'embed/');
                    } else if (urlPart.includes('youtu.be/')) {
                        urlPart = urlPart.replace('youtu.be/', 'www.youtube.com/embed/');
                    }

                    embedHtml = `
                        <div class="embed-container">
                            <iframe src="${escapeHtml(urlPart)}" allowfullscreen></iframe>
                        </div>
                    `;
                }

                feedDiv.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="creator-info">
                                <span class="badge">${badgeLabel}</span>
                                <strong style="color: var(--text-main); font-size: 0.9rem;">${escapeHtml(publisher)}</strong>
                            </div>
                            <span>${new Date(post.created_at).toLocaleDateString()}</span>
                        </div>
                        <h4>${escapeHtml(post.title)}</h4>
                        <p>${escapeHtml(displayBody)}</p>
                        ${embedHtml}
                        <div class="interaction-bar">
                            <button class="interaction-btn" onclick="this.innerText = '👍 Liked (' + (parseInt(this.innerText.replace(/[^0-9]/g, '') || 0) + 1) + ')'">👍 Like</button>
                            <button class="interaction-btn" onclick="const c = prompt('Write a comment:'); if(c) alert('Comment posted successfully!');">💬 Comment</button>
                            <button class="interaction-btn" onclick="alert('Subscribed to publisher updates!')">🔔 Subscribe</button>
                            <button class="interaction-btn" onclick="alert('Post link copied to clipboard!')">🔗 Share</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) { alert('You must be logged in to publish!'); return; }

            const content_type = document.getElementById('contentType').value;
            const title = document.getElementById('postTitle').value;
            const bodyText = document.getElementById('postBody').value;
            const mediaUrl = document.getElementById('mediaUrl').value;
            
            let fullBody = bodyText;
            if (mediaUrl) {
                fullBody += '\n[Embed URL: ' + mediaUrl + ']';
            }
            fullBody += '\n\n(Publisher: ' + currentUser.email + ')';

            const { error } = await _supabase.from('posts').insert([{
                content_type: content_type,
                title: title,
                body: fullBody
            }]);

            if (error) {
                alert('Publishing error: ' + error.message);
            } else {
                document.getElementById('postForm').reset();
                loadPosts();
                loadCreators();
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        checkUser();
    </script>
</body>
</html>
